name: atlas-cinema

services:
  discovery-server:
    build:
      context: ../backend/discovery-server

    ports:
      - "8761:8761"

  # movie-service

  movie-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5433:5432"

    volumes:
      - movie-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d movie_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  movie-service:
    build:
      context: ../backend/movie-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://movie-db:5432/movie_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      movie-db:
        condition: service_healthy

  # cinema-service

  cinema-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5434:5432"

    volumes:
      - cinema-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d cinema_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  cinema-service:
    build:
      context: ../backend/cinema-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://cinema-db:5432/cinema_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      cinema-db:
        condition: service_healthy

  # screening-service

  screening-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: screening_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5435:5432"

    volumes:
      - screening-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d screening_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  screening-service:
    build:
      context: ../backend/screening-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://screening-db:5432/screening_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      screening-db:
        condition: service_healthy

  # booking-service
  booking-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5436:5432"

    volumes:
      - booking-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d booking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-service:
    build:
      context: ../backend/booking-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    depends_on:
      discovery-server:
        condition: service_started

      booking-db:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

  # api-gateway

  api-gateway:
    build:
      context: ../backend/api-gateway

    ports:
      - "8080:8080"

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

    depends_on:
      - discovery-server
      - movie-service
      - cinema-service
      - screening-service
      - booking-service

  # redis
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # kafka
  # https://github.com/apache/kafka/blob/trunk/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Unique id of this Kafka node in the KRaft cluster
      KAFKA_NODE_ID: 1

      # This single node acts as both broker and controller
      KAFKA_PROCESS_ROLES: broker,controller

      # Maps each listener name to its security protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Defines where Kafka listens for controller, host and Docker traffic
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092

      # Tells clients which addresses they should use to connect
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092

      # Listener used for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Listener used by the KRaft controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Defines the controller quorum members for KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Single-node setup requires internal topics to use one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Avoids waiting before the first consumer group rebalance
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Allows transaction state to work with a single broker
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Stores transaction state with one replica in this single-node setup
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Uses one replica for the share coordinator internal topic
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      # Allows the share coordinator to work with one broker
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # Directory where Kafka stores its local log data
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # Identifies the KRaft cluster
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

volumes:
  movie-db-data:
  cinema-db-data:
  screening-db-data:
  booking-db-data:
