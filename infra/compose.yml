name: atlas-cinema

services:
  discovery-server:
    build:
      context: ../backend/discovery-server

    ports:
      - "8761:8761"

  # movie-service

  movie-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: movie_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5433:5432"

    volumes:
      - movie-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d movie_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  movie-service:
    build:
      context: ../backend/movie-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://movie-db:5432/movie_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      movie-db:
        condition: service_healthy

  # cinema-service

  cinema-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: cinema_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5434:5432"

    volumes:
      - cinema-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d cinema_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  cinema-service:
    build:
      context: ../backend/cinema-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://cinema-db:5432/cinema_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      cinema-db:
        condition: service_healthy

  # screening-service

  screening-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: screening_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5435:5432"

    volumes:
      - screening-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d screening_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  screening-service:
    build:
      context: ../backend/screening-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://screening-db:5432/screening_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started
      screening-db:
        condition: service_healthy

  # booking-service
  booking-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas

    ports:
      - "5436:5432"

    volumes:
      - booking-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d booking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-service:
    build:
      context: ../backend/booking-service

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

      DB_URL: jdbc:postgresql://booking-db:5432/booking_db
      DB_USERNAME: atlas
      DB_PASSWORD: atlas

    depends_on:
      discovery-server:
        condition: service_started

      booking-db:
        condition: service_healthy

  # api-gateway

  api-gateway:
    build:
      context: ../backend/api-gateway

    ports:
      - "8080:8080"

    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_PREFER_IP: "true"

    depends_on:
      - discovery-server
      - movie-service
      - cinema-service
      - screening-service
      - booking-service

volumes:
  movie-db-data:
  cinema-db-data:
  screening-db-data:
  booking-db-data:
