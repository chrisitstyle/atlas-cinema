# Flyway owns the database schema in integration tests
spring.jpa.hibernate.ddl-auto=validate

# disable Open Session in View because this service has no web request flow
spring.jpa.open-in-view=false

# Flyway migrations should run against the Testcontainers database
spring.flyway.enabled=true

# dont start the real Kafka consumer during tests that invoke the listener manually
spring.kafka.listener.auto-startup=false