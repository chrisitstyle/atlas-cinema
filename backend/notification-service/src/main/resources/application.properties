spring.application.name=notification-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/notification_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# all notification-service instances belong to the same consumer group
spring.kafka.consumer.group-id=notification-service

# start from the earliest available event when this consumer group has no stored offset yet
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka message keys are booking ids serialized as strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka message values are JSON and will be converted to Java objects
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# the producer does not send Java type headers, so the consumer must know the target type
spring.kafka.consumer.properties[spring.json.value.default.type]=com.atlascinema.notification.event.BookingCancelledEvent

# trust only our own event package during JSON deserialization
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.atlascinema.notification.event

# topic consumed by notification-service
notification.kafka.booking-events-topic=booking-events

# failed events are moved here after all retries are exhausted
notification.kafka.booking-events-dlt-topic=booking-events-dlt

# delay between consecutive blocking retry attempts
notification.kafka.retry-interval=${NOTIFICATION_KAFKA_RETRY_INTERVAL:1s}

# number of retries after the initial failed attempt
notification.kafka.max-retries=${NOTIFICATION_KAFKA_MAX_RETRIES:2}

# commit offsets record by record instead of treating the whole poll as one batch
spring.kafka.listener.ack-mode=record

# notification-service also produces records when moving failed events to the DLT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# dont couple Kafka messages to Java package names through type headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false