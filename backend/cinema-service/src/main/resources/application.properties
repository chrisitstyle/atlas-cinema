spring.application.name=cinema-service

server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cinema_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG


# validates the JWT issuer against the Atlas Cinema realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas-cinema}
# retrieves Keycloak public keys for JWT signature verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/atlas-cinema/protocol/openid-connect/certs}
# rejects tokens that are not intended for the Atlas Cinema API
spring.security.oauth2.resourceserver.jwt.audiences[0]=atlas-cinema-api
