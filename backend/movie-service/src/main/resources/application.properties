spring.application.name=movie-service

server.port=8081
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/movie_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true