spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

# movie-service
spring.cloud.gateway.server.webflux.routes[0].id=movie-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://movie-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/movies/**

# cinema-service
spring.cloud.gateway.server.webflux.routes[1].id=cinema-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://cinema-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/cinemas/**

# screening-service
spring.cloud.gateway.server.webflux.routes[2].id=screening-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://screening-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/screenings/**

# booking-service
spring.cloud.gateway.server.webflux.routes[3].id=booking-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/bookings/**


# OAuth2 Resource Server

# validates the JWT issuer against the Atlas Cinema realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas-cinema}

# provides public keys for JWT signature verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/atlas-cinema/protocol/openid-connect/certs}

# ensures the JWT is intended for the Atlas Cinema API
spring.security.oauth2.resourceserver.jwt.audiences[0]=atlas-cinema-api

