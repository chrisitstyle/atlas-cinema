spring.application.name=payment-service

server.port=8085

# eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Use the container IP when running inside Docker
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

# Payment owns its PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5438/payment_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

# Flyway will manage the schema instead of Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# stop waiting when booking-service cannot establish a connection
spring.cloud.openfeign.client.config.booking-service.connectTimeout=2000

# limit how long payment-service waits for booking-service response
spring.cloud.openfeign.client.config.booking-service.readTimeout=3000

# simulated provider outcome used during development
payment.simulator.outcome=${PAYMENT_SIMULATOR_OUTCOME:APPROVED}

# automatically recover interrupted payment processing
payment.reconciliation.scheduler.enabled=${PAYMENT_RECONCILIATION_ENABLED:true}

# time between completed scheduler runs
payment.reconciliation.scheduler.fixed-delay-ms=30000

# delay before the first scheduler run
payment.reconciliation.scheduler.initial-delay-ms=30000

# maximum number of payments processed in one batch
payment.reconciliation.batch-size=50

# minimum age of a PROCESSING payment before recovery
payment.reconciliation.minimum-processing-age-seconds=60

# minimum delay before retrying an unresolved payment
payment.reconciliation.retry-delay-seconds=120