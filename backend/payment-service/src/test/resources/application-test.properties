spring.application.name=payment-service-test

# eureka is not needed for database integration tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# verify entity mappings against the Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# apply real database migrations to the Testcontainers database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# integration tests invoke reconciliation explicitly
payment.reconciliation.scheduler.enabled=false

# tests invoke outbox publishing explicitly
payment.outbox.publisher.scheduler.enabled=false

# avoid connecting to a real Kafka broker during database integration tests
spring.kafka.admin.auto-create=false

# tests invoke refund listener explicitly
payment.refund.consumer.enabled=false

# integration tests invoke refund processing explicitly
payment.refund.processing.scheduler.enabled=false

payment.processing.scheduler.enabled=false