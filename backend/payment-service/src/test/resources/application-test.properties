spring.application.name=payment-service-test

# eureka is not needed for database integration tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# verify entity mappings against the Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# apply real database migrations to the Testcontainers database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true