spring.application.name=booking-service

server.port=8084

# eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

# db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/booking_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

# jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

booking.hold-duration=${BOOKING_HOLD_DURATION:10m}
booking.expiration-check-interval=${BOOKING_EXPIRATION_CHECK_INTERVAL:30s}

# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# kafka keys are simple strings such as booking ids
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# event objects are serialized to JSON before Kafka sends them
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# do not expose java class names in Kafka headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# topic used for events produced by booking-service
booking.kafka.topic=booking-events

# enables background publishing of transactional outbox events
booking.outbox.publisher.enabled=${BOOKING_OUTBOX_PUBLISHER_ENABLED:true}

# delay between consecutive outbox polling attempts
booking.outbox.publish-interval=${BOOKING_OUTBOX_PUBLISH_INTERVAL:1s}

# Payment result events produced by payment-service
booking.payment-events.topic=payment-events
booking.payment-events.group-id=booking-service-payment-events

# deserialize payment messages as raw strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# read events from the beginning when a new consumer group is created
spring.kafka.consumer.auto-offset-reset=earliest

# commit offsets after successful listener processing
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record