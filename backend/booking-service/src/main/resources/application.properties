spring.application.name=booking-service

server.port=8084

# eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

# db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/booking_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

# jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

booking.hold-duration=${BOOKING_HOLD_DURATION:10m}
booking.expiration-check-interval=${BOOKING_EXPIRATION_CHECK_INTERVAL:30s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}