spring.application.name=booking-service

server.port=8084

# eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

# db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/booking_db}
spring.datasource.username=${DB_USERNAME:atlas}
spring.datasource.password=${DB_PASSWORD:atlas}

# jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

booking.hold-duration=${BOOKING_HOLD_DURATION:10m}
booking.expiration-check-interval=${BOOKING_EXPIRATION_CHECK_INTERVAL:30s}

# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# kafka keys are simple strings such as booking ids
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# event objects are serialized to JSON before Kafka sends them
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# do not expose java class names in Kafka headers
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# topic used for events produced by booking-service
booking.kafka.topic=booking-events

# enables background publishing of transactional outbox events
booking.outbox.publisher.enabled=${BOOKING_OUTBOX_PUBLISHER_ENABLED:true}

# delay between consecutive outbox polling attempts
booking.outbox.publish-interval=${BOOKING_OUTBOX_PUBLISH_INTERVAL:1s}

# Payment result events produced by payment-service
booking.payment-events.topic=payment-events
booking.payment-events.group-id=booking-service-payment-events

# deserialize payment messages as raw strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# read events from the beginning when a new consumer group is created
spring.kafka.consumer.auto-offset-reset=earliest

# commit offsets after successful listener processing
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Payment inbox business processing
booking.payment-inbox.processing.enabled=true
booking.payment-inbox.processing.fixed-delay-ms=5000
booking.payment-inbox.processing.initial-delay-ms=5000

# Completed refunds published by payment-service
booking.payment-refunds.topic=payment-refunds
booking.payment-refunds.group-id=booking-service-payment-refunds
booking.payment-refunds.consumer.enabled=${BOOKING_PAYMENT_REFUNDS_CONSUMER_ENABLED:true}

# validates JWTs issued by the Atlas Cinema Keycloak realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/atlas-cinema}

# retrieves Keycloak public keys for JWT signature verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/atlas-cinema/protocol/openid-connect/certs}

# requires access tokens intended for the Atlas Cinema API
spring.security.oauth2.resourceserver.jwt.audiences[0]=atlas-cinema-api



# registers booking-service as an OAuth2 client using Client Credentials
spring.security.oauth2.client.registration.booking-service.provider=keycloak
spring.security.oauth2.client.registration.booking-service.client-id=atlas-cinema-booking-service
spring.security.oauth2.client.registration.booking-service.client-secret=${BOOKING_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.booking-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.booking-service.client-authentication-method=client_secret_basic

# defines the Keycloak token endpoint for service authentication
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/atlas-cinema/protocol/openid-connect/token}

