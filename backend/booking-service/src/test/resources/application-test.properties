spring.application.name=booking-service-test

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

booking.hold-duration=10m

booking.outbox.publisher.enabled=false

# integration tests invoke payment processing explicitly
booking.payment-inbox.processing.enabled=false